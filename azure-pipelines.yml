trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
- task: UseDotNet@2
  displayName: Use .NET 8 SDK
  inputs:
    packageType: sdk
    version: 8.0.x

- script: dotnet restore MeterDeviceTelemetry.sln
  displayName: Restore solution

- script: dotnet build MeterDeviceTelemetry.sln --configuration $(buildConfiguration) --no-restore
  displayName: Build solution

- script: >
    dotnet test MeterDeviceTelemetry.Tests/MeterDeviceTelemetry.Tests.csproj
    --configuration $(buildConfiguration)
    --no-build
    --logger "trx;LogFileName=test-results.trx"
    --results-directory "$(Agent.TempDirectory)/TestResults"
  displayName: Run tests

- task: PublishTestResults@2
  displayName: Publish test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
    failTaskOnFailedTests: true
    testRunTitle: MeterDeviceTelemetry tests